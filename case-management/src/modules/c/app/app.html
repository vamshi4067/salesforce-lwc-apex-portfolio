<template>
 <div class="shell">
  <aside class="rail"><a href="/" class="logo"><span class="logo-mark">S</span><span>Support<br/><strong>Desk</strong></span></a><div class="rail-nav"><button class="rail-link active" data-tab="workspace" onclick={navigate}><span>▤</span> Case workspace</button><button class="rail-link" data-tab="guide" onclick={navigate}><span>◎</span> How it works</button><button class="rail-link" data-tab="source" onclick={navigate}><span>⌘</span> Explore the code</button></div><div class="rail-bottom"><span class="online"></span> Sample data<br/><small>A Salesforce demo</small></div></aside>
  <main class="main"><header class="top"><span>Service operations <span class="slash">/</span> Case management</span><button onclick={reset} class="reset">Reset demo</button></header>
   <template lwc:if={isWorkspace}>
    <div class="page-title"><div><h1>Case workspace</h1><p>Give each customer issue the attention it needs.</p></div><button class="primary new-button" onclick={openNew}>+ New case</button></div>
    <div class="case-counts" aria-label="Case totals"><span><strong>{newCount}</strong> New</span><span><strong>{workingCount}</strong> Working</span><span><strong>{closedCount}</strong> Closed</span></div><div class="workspace"><section class="queue" aria-label="Case queue"><div class="queue-heading"><div><h2>Incoming cases</h2><p>{count} shown</p></div><label><span class="sr-only">Filter by priority</span><select class="filter" onchange={filterChanged}><option>All</option><option>High</option><option>Medium</option><option>Low</option></select></label></div>
     <div class="queue-filters"><label><span class="sr-only">Search cases</span><input class="search" type="search" placeholder="Search cases or customers" oninput={searchChanged}/></label><label><span class="sr-only">Filter by status</span><select class="status-filter" onchange={statusFilterChanged}><option value="All">All statuses</option><option>New</option><option>Working</option><option>Closed</option></select></label></div><div class="queue-list"><template for:each={cases} for:item="item"><button key={item.id} data-id={item.id} class={item.selected} onclick={select}><div class="row-top"><span>#{item.id}</span><span class={item.priorityClass}>{item.priority}</span></div><strong>{item.subject}</strong><div class="row-bottom"><span>{item.customer}</span><span>{item.status}</span></div></button></template><template lwc:if={cases.length}></template><template lwc:else><p class="empty">No cases match this filter.</p></template></div>
    </section>
    <section class="detail" aria-label="Selected case"><div class="detail-head"><div><span class="case-id">CASE #{selected.id} · {selected.channel}</span><h2>{selected.subject}</h2><p>From {selected.customer} <span>·</span> {selected.company}</p></div><span class="status">{selected.status}</span></div>
     <div class="case-meta"><span>Owner: <strong>{selected.owner}</strong></span><span>{followUpText}</span><span>{escalationLabel}</span></div><div class="conversation"><div class="section-title"><h3>Customer request</h3><span>{selected.channel}</span></div><div class="customer"><span class="avatar">{selected.customerInitial}</span><div><strong>{selected.customer}</strong><small>{selected.email}</small></div></div><p class="request">{selected.description}</p></div>
     <div class="work-area"><div class="section-title"><h3>Update case</h3><span>Changes stay in this session</span></div><div class="fields"><label>Status<select onchange={statusChanged}><template for:each={statusOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.value}</option></template></select></label><label>Priority<select onchange={priorityChanged}><template for:each={priorityOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.value}</option></template></select></label></div><div class="fields"><label>Assigned to<select onchange={ownerChanged}><template for:each={ownerOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.value}</option></template></select></label><label>Follow-up date<input class="date-input" type="date" value={draftFollowUp} onchange={followUpChanged}/></label></div><label class="note-label">Internal note <span>required to close a case</span><textarea class="case-note" oninput={noteChanged} maxlength="500" placeholder="Add a note for the next agent"></textarea></label><div class="save-row"><span role="status">{message}</span><span class="error" role="alert">{error}</span><button class="primary" onclick={save}>Save changes <span>→</span></button></div></div>
     <div class="escalation"><h3>Escalate this case</h3><p>Flag a case for a supervisor and record why it needs attention.</p><label><span class="sr-only">Reason for escalation</span><input type="text" maxlength="500" value={escalationReason} oninput={escalationChanged} placeholder="Reason for escalation"/></label><button onclick={escalate}>Escalate case</button></div><div class="history"><h3>Activity timeline</h3><template for:each={activity} for:item="event"><div key={event.id} class="activity"><span>{event.date}</span><p>{event.text}</p></div></template></div><div class="history"><h3>Internal notes</h3><template for:each={notes} for:item="n"><p key={n.id}>{n.text}</p></template><template lwc:if={notes.length}></template><template lwc:else><p>No notes yet.</p></template></div>
    </section></div>
   </template>
   <template lwc:if={isNew}><section class="info new-form"><h1>Create a case.</h1><p>Record a customer issue and route it to the right person.</p><div class="new-fields"><label>Customer name<input name="customer" value={newCase.customer} oninput={newField} maxlength="100" required/></label><label>Company <span>optional</span><input name="company" value={newCase.company} oninput={newField}/></label><label class="wide">Subject<input name="subject" value={newCase.subject} oninput={newField} maxlength="255" required/></label><label class="wide">Description<textarea name="description" oninput={newField} maxlength="2000" required></textarea></label><label>Priority<select name="priority" onchange={newField}><option>Medium</option><option>High</option><option>Low</option></select></label><label>Assign to<select name="owner" onchange={newField}><option>Support queue</option><option>Jordan Lee</option><option>Sam Rivera</option><option>Alex Morgan</option></select></label><label>Follow-up date <span>optional</span><input type="date" name="followUp" onchange={newField}/></label></div><p class="error" role="alert">{error}</p><div class="new-actions"><button class="reset" data-tab="workspace" onclick={navigate}>Cancel</button><button class="primary" onclick={create}>Create case</button></div></section></template>
   <template lwc:if={isGuide}><section class="info"><h1 class="guide-title">From customer request to resolution.</h1><p>This demo follows a support agent as they review a case, set its priority, update its status and add an internal note. Closing a case requires a resolution note; closed cases can be reopened.</p><div class="info-grid"><article><h2>In this browser</h2><p>A Lightning Web Component renders the case queue, search and filters and responds to your selections. A JavaScript data service holds fictional cases in memory and validates changes. Refreshing or resetting restores the sample data.</p></article><article><h2>In Salesforce</h2><p>The included Salesforce LWC calls an Apex controller to read and update standard Case records. Apex validates the changes, requires a resolution note when closing a case, and uses user-mode access. The org version stores internal notes as non-public Case Comments. The Salesforce component also calls Apex for case creation, assignment, follow-up and escalation; the public timeline uses sample session data.</p></article></div><p class="disclosure">This public demo does not connect to a Salesforce org or execute Apex. Salesforce deployment and tests must be verified in your own sandbox.</p><button class="primary" data-tab="workspace" onclick={navigate}>Try the workspace →</button></section></template>
   <template lwc:if={isSource}><section class="info"><h1>Built to be explored.</h1><p>Download the project to inspect both the public LWC and the Salesforce implementation.</p><div class="info-grid"><article><h2>Lightning Web Components</h2><p>The public component manages the queue and case editor. The Salesforce component invokes Apex and refreshes the records after an update.</p></article><article><h2>Apex controller</h2><p>The controller queries standard Case records, validates status, priority and note length, and saves changes with the current user’s permissions.</p></article></div><a class="download" href="/case-management-source.zip" download>Download source code ↓</a></section></template>
   <footer>CASE MANAGEMENT DEMO <span>Built with Lightning Web Components · Apex source included</span></footer>
  </main>
 </div>
</template>
