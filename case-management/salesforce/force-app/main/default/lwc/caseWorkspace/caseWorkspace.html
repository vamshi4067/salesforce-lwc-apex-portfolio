<template><lightning-card title="Case workspace" icon-name="standard:case"><div class="slds-p-around_medium"><p>Select a case to update its status and priority.</p><template for:each={rows} for:item="item"><div key={item.Id} class="slds-p-vertical_x-small"><lightning-button variant="base" label={item.Subject} data-id={item.Id} onclick={select}></lightning-button> <span>{item.CaseNumber} · {item.Status} · {item.Priority}</span></div></template><div class="slds-m-top_medium"><lightning-input label="New case subject" value={newSubject} onchange={changeNewSubject}></lightning-input><lightning-textarea label="New case description" value={newDescription} onchange={changeNewDescription}></lightning-textarea><lightning-button label="Create case" onclick={create}></lightning-button></div><template lwc:if={hasSelection}><div class="slds-m-top_medium"><lightning-combobox label="Status" value={status} options={statusOptions} onchange={changeStatus}></lightning-combobox><lightning-combobox label="Priority" value={priority} options={priorityOptions} onchange={changePriority}></lightning-combobox><lightning-textarea label="Internal note (required when closing)" value={note} maxlength="500" onchange={changeNote}></lightning-textarea><lightning-button class="slds-m-top_medium" variant="brand" label="Save changes" onclick={save}></lightning-button><lightning-input label="Owner user or queue ID" value={ownerId} onchange={changeOwner}></lightning-input><lightning-input type="date" label="Follow-up date" value={followUp} onchange={changeFollowUp}></lightning-input><lightning-button label="Save assignment and follow-up" onclick={assign}></lightning-button><lightning-input label="Escalation reason" value={reason} onchange={changeReason}></lightning-input><lightning-button label="Escalate case" onclick={escalateSelected}></lightning-button><h3 class="slds-m-top_medium">Internal case comments</h3><template for:each={notes} for:item="comment"><p key={comment.Id}>{comment.CommentBody}</p></template></div></template><template lwc:if={message}><p role="status">{message}</p></template><template lwc:if={error}><p role="alert">{error}</p></template></div></lightning-card></template>
