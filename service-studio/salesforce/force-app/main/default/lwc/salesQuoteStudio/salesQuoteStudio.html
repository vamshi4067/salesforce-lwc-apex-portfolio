<template
  ><lightning-card
    title="Sales quote & discount approval"
    icon-name="standard:quotes"
    ><div class="slds-p-around_medium">
      <p class="slds-m-bottom_medium">
        Build a fictional Evergreen Home equipment quote. Prices are
        recalculated in Apex. Discounts above 10% require manager review.
      </p>
      <template for:each={products} for:item="product"
        ><lightning-input
          key={product.id}
          data-id={product.id}
          type="number"
          label={product.name}
          value={product.quantity}
          min="0"
          max="100"
          step="1"
          required
          onchange={quantityChanged}
          disabled={locked}
        ></lightning-input></template
      ><lightning-input
        type="number"
        label="Discount (%)"
        value={discount}
        min="0"
        max="30"
        step="0.01"
        required
        onchange={discountChanged}
        disabled={locked}
      ></lightning-input
      ><lightning-textarea
        label="Discount justification (required above 10%)"
        value={reason}
        max-length="500"
        onchange={reasonChanged}
        disabled={locked}
      ></lightning-textarea>
      <p
        lwc:if={error}
        role="alert"
        class="slds-text-color_error slds-m-vertical_medium"
      >
        {error}
      </p>
      <lightning-spinner
        lwc:if={busy}
        alternative-text="Saving quote"
        size="small"
      ></lightning-spinner>
      <div class="slds-m-top_medium">
        <lightning-button
          lwc:if={quote}
          label="Start a new draft"
          onclick={restart}
          disabled={busy}
        ></lightning-button
        ><lightning-button
          lwc:else
          variant="brand"
          label="Submit quote"
          onclick={save}
          disabled={busy}
        ></lightning-button>
      </div>
      <section lwc:if={quote} class="slds-m-top_large" aria-label="Saved quote">
        <h2 class="slds-text-heading_small">{quote.Name}: {quote.Status__c}</h2>
        <p>
          Quote total:
          <lightning-formatted-number
            value={quote.Total__c}
            format-style="currency"
            currency-code="USD"
          ></lightning-formatted-number>
        </p>
        <p>{quote.Decision_Note__c}</p>
      </section>
      <div lwc:if={pending} class="slds-m-top_medium">
        <p>Review requires the Service Studio Manager permission set.</p>
        <lightning-textarea
          label="Manager decision note"
          value={note}
          max-length="500"
          onchange={noteChanged}
          disabled={busy}
        ></lightning-textarea
        ><lightning-button
          label="Approve"
          data-decision="Approved"
          onclick={decide}
          disabled={busy}
        ></lightning-button
        ><lightning-button
          class="slds-m-left_small"
          label="Reject"
          data-decision="Rejected"
          onclick={decide}
          disabled={busy}
        ></lightning-button>
      </div></div></lightning-card
></template>
