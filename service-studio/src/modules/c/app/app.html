<template>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Service Studio home"
        ><svg viewBox="0 0 32 32" aria-hidden="true">
          <path
            fill="currentColor"
            d="M3 3h12v12H3zM17 3h12v12H17zM3 17h12v12H3z"
          />
          <path fill="#a44d35" d="M17 17h12v12H17z" /></svg
        ><span>Service <span class="brand-light">Studio</span></span></a
      >
      <nav aria-label="Project navigation">
        <button
          class={architectureClass}
          data-view="architecture"
          onclick={changeView}
        >
          How it works</button
        ><button class={sourceClass} data-view="source" onclick={changeView}>
          Source code
        </button>
      </nav>
      <a class="download" href="/service-studio-source.zip" download
        >Download project<svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M5 15 15 5M5 5h10v10" /></svg
      ></a>
    </header>
    <section class="intro">
      <div>
        <h1>Book a service visit.</h1>
        <p>Choose a service, find an available technician, and pick a time that works for you.</p>
      </div>
    </section>
    <main id="main">
      <div class="workspace-heading">
        <nav class="demo-tabs" aria-label="Live demo"><button class={bookingClass} aria-current={bookingCurrent} data-view="booking" onclick={changeView}><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="1"/><path d="M6 2v4M14 2v4M3 8h14m-10 4 2 2 4-4"/></svg>Field-service booking</button></nav>
        <button class="reset" onclick={reset}>Reset demo</button>
      </div>
      <div hidden={bookingHidden}>
        <c-appointment-booking></c-appointment-booking>
      </div>
      <section hidden={architectureHidden} class="architecture">
        <h2>Follow the work, from click to record.</h2>
        <p class="lead">A field-service booking workflow, with the implementation open for inspection. The public demo runs in your browser; the included Salesforce package is designed to run against records in your org.</p>
        <div class="architecture-columns"><article><h3>What’s running here</h3><ol>
          <li><strong>Lightning Web Components</strong><p>The booking component presents service types, available dates, technician slots and customer details.</p></li>
          <li><strong>Browser data adapter</strong><p>A JavaScript service filters fictional technicians and times, validates requests and keeps appointments in memory.</p></li>
          <li><strong>Booking and cancellation</strong><p>A confirmed appointment removes its slot. Cancelling releases it. Reset restores the sample data.</p></li>
        </ol></article><article><h3>What runs in Salesforce</h3><ol>
          <li><strong>Platform LWC calls Apex</strong><p>The fieldBookingStudio component calls Apex to retrieve availability and submit or cancel a booking.</p></li>
          <li><strong>Server-side validation</strong><p>BookingStudioController checks the customer, service and slot, then locks the selected slot before reserving it.</p></li>
          <li><strong>Records and permissions</strong><p>Custom objects store availability and appointments. Sharing and user-mode database access respect the caller’s access.</p></li>
        </ol></article></div>
        <div class="engineering"><h3>Decisions worth inspecting</h3><div><strong>Matching</strong><p>Availability matches the service to a technician’s skills and filters already booked slots.</p></div><div><strong>Concurrency</strong><p>Apex uses FOR UPDATE and a unique active slot reference to guard competing requests.</p></div><div><strong>Testing</strong><p>Node tests cover invalid input, slot matching, concurrent requests and cancellation. Apex tests are included for org verification.</p></div></div>
      </section>
      <section hidden={sourceHidden} class="source-section">
        <div class="source-heading">
          <div>
            <h2>The implementation, without the mystery.</h2>
            <p>Browse the actual source, or download the complete project.</p>
          </div>
          <label for="source-file"
            >Project file<select id="source-file" onchange={fileChanged}>
              <template for:each={options} for:item="file"
                ><option key={file.name} value={file.name}>
                  {file.name}
                </option></template
              >
            </select></label
          >
        </div>
        <p class="source-note">
          .cls files run in Salesforce. Public demo components call
          workflowService.js in the browser. The download includes object
          metadata, permission sets, tests and setup instructions.
        </p>
        <p lwc:if={sourceLoading} role="status">Loading source…</p>
        <p lwc:if={sourceError} class="error" role="alert">{sourceError}</p>
        <pre
          tabindex="0"
          aria-label="Project source code"
        ><code>{source}</code></pre>
      </section>
      <div lwc:if={isDemo} class="implementation-bar">
        <button onclick={inspect}>
          Inspect the Apex<svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M5 15 15 5M5 5h10v10" />
          </svg>
        </button>
      </div>
    </main>
    <footer>
      <p>
        <span class="sample-dot"></span>Sample data mode
        <span class="footer-detail"
          >· Apex behavior is simulated. No Salesforce org is connected.</span
        >
      </p>
      <span>Salesforce LWC · Apex · JavaScript</span>
    </footer>
  </div>
</template>
