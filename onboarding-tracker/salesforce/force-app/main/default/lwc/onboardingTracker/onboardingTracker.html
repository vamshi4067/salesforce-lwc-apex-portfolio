<template><lightning-card title="Customer onboarding" icon-name="standard:account"><div class="slds-p-around_medium"><template lwc:if={customer}><p><strong>{customer.Name}</strong> · {customer.Onboarding_Stage__c}</p><p>{completed} of {total} required tasks complete</p><lightning-progress-bar value={percentage} size="medium"></lightning-progress-bar><template for:each={currentTasks} for:item="task"><div key={task.Id} class="slds-p-vertical_small"><strong>{task.Subject}</strong> · {task.ActivityDate} · {task.Status} <template lwc:if={task.done}></template><template lwc:else><lightning-button label="Mark done" data-id={task.Id} onclick={finish}></lightning-button></template></div></template><lightning-button variant="brand" label="Continue to next stage" onclick={next}></lightning-button><div class="slds-m-top_medium"><lightning-input label="Follow-up task" value={subject} onchange={subjectChanged}></lightning-input><lightning-input type="date" label="Due date" value={dueDate} onchange={dueChanged}></lightning-input><lightning-button label="Add follow-up" onclick={add}></lightning-button></div></template><template lwc:if={message}><p role="status">{message}</p></template><template lwc:if={error}><p role="alert">{error}</p></template></div></lightning-card></template>
