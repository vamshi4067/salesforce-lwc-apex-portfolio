<template><div class="page"><header class="header"><a class="brand" href="/"><span class="brand-mark">O</span><span>Onboarding <span>Tracker</span></span></a><nav aria-label="Site navigation"><button data-tab="journey" onclick={navigate}>Customer journey</button><button data-tab="about" onclick={navigate}>How it’s built</button></nav><button class="reset" onclick={reset}>Reset demo</button></header>
<main><template lwc:if={isJourney}><section class="workspace-overview" aria-label="Onboarding workspace overview"><div class="overview-header"><span class="overview-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 9h8M8 12h8M8 15h5"/></svg></span><div><span class="overview-label">Customer onboarding</span><h1>Onboarding workspace</h1><p>Track the work from signed agreement to launch.</p></div><span class="sample-badge">Sample data</span></div><div class="overview-stats"><div><span>Current stage</span><strong class="stage-value">{plan.stage}</strong></div><div><span>Progress</span><strong>{progress}</strong></div><div><span>Required complete</span><strong>{completeCount} / {totalCount}</strong></div><div><span>Overdue tasks</span><strong>{overdueCount}</strong></div><div><span>Open blockers</span><strong>{openBlockerCount}</strong></div></div></section>
<section class="journey"><div class="section-head"><div><h2>The journey</h2><p>Select a stage to explore its tasks.</p></div><div class="progress-label"><strong>{progress}</strong><span>required work complete</span></div></div><div class="progress-track" role="progressbar" aria-label="Required tasks complete" aria-valuetext={progress}><span style={progressStyle}></span></div><div class="stages"><template for:each={stageRows} for:item="stage"><button key={stage.name} type="button" class={stage.css} data-stage={stage.name} aria-pressed={stage.pressed} onclick={viewStageChanged}><span class="stage-number">{stage.number}</span><span class="stage-text"><strong>{stage.name}</strong><small>{stage.state}</small></span></button></template></div></section>
<div class="content-grid"><section class="tasks"><div class="task-head"><div><p class="section-caption">{stageCaption}</p><h2>{viewStage}</h2><p>{readyMessage}</p></div><template lwc:if={canEdit}><button class="add" onclick={toggleForm}>+ Add follow-up</button></template><template lwc:else><button class="add" onclick={returnToCurrent}>Back to current stage</button></template></div><template lwc:if={showForm}><div class="follow-form"><label>Follow-up task<input type="text" maxlength="100" value={subject} oninput={subjectChanged} placeholder="e.g. Call the customer"/></label><label>Due date<input type="date" value={due} onchange={dueChanged}/></label><button class="primary" onclick={addTask}>Add task</button></div></template><div class="task-list"><template for:each={currentTasks} for:item="task"><article key={task.id} class={task.css}><span class="task-indicator"></span><div class="task-copy"><strong>{task.subject}</strong><span>{task.dateLabel} · {task.ownerLabel}</span></div><template lwc:if={task.required}><span class="required">Required</span></template><template lwc:if={canEdit}><button class="edit-task" data-id={task.id} onclick={editTask}>Edit</button></template><template lwc:if={task.complete}><span class="done-label">Done ✓</span></template><template lwc:else><template lwc:if={canEdit}><button data-id={task.id} aria-label={task.buttonLabel} onclick={finish}>Mark done</button></template><template lwc:else><span class="preview-label">Preview</span></template></template></article></template></div><template lwc:if={taskEditing}><div class="follow-form"><label>Task owner<input type="text" maxlength="100" value={taskOwner} oninput={editOwner}/></label><label>Due date<input type="date" value={taskDue} onchange={editDue}/></label><div><button class="primary" onclick={saveTask}>Save task</button><button class="add" onclick={cancelTask}>Cancel</button></div></div></template><div class="task-foot"><div><p role="status">{message}</p><p class="error" role="alert">{error}</p></div><template lwc:if={canEdit}><button class="primary" onclick={advance} disabled={isFinal}>{nextLabel} <span>→</span></button></template></div></section>
<aside class="sidebar"><div class="sidebar-top"><h2>Customer details</h2><p>{plan.customer}<br/>Contact · {plan.contact}<br/>Manager · {plan.owner}</p><button class="aside-action" onclick={openCustomer}>Edit details &amp; add note</button><template lwc:if={showCustomer}><div class="detail-form"><label>Customer<input data-field="customerName" value={customerName} oninput={customerField} maxlength="100"/></label><label>Contact<input data-field="customerContact" value={customerContact} oninput={customerField} maxlength="100"/></label><label>Account manager<input data-field="customerOwner" value={customerOwner} oninput={customerField} maxlength="100"/></label><label>Note <span>optional</span><textarea data-field="customerNote" oninput={customerField} maxlength="500"></textarea></label><button class="primary" onclick={saveCustomer}>Save details</button></div></template><template for:each={notes} for:item="note"><p key={note.id} class="customer-note">{note.text}</p></template></div><div class="sidebar-bottom"><h2>Stage blockers</h2><p>Open blockers prevent this stage from advancing.</p><template lwc:if={hasBlockers}><template for:each={blockers} for:item="blocker"><div key={blocker.id} class="blocker"><span>{blocker.text}</span><template lwc:if={blocker.resolved}><small>Resolved</small></template><template lwc:elseif={blocker.canResolve}><button data-id={blocker.id} onclick={resolveBlockerAction}>Resolve</button></template></div></template></template><template lwc:else><p>No blockers in this stage.</p></template><template lwc:if={canEdit}><label class="blocker-input">Add a blocker<input type="text" maxlength="300" value={blockerText} oninput={blockerChanged} placeholder="What needs attention?"/></label><button class="aside-action" onclick={addBlockerAction}>Add blocker</button></template></div><div class="sidebar-bottom"><h2>Activity</h2><template lwc:if={hasActivity}><template for:each={activity} for:item="item"><p key={item.id} class="activity-item"><small>{item.date}</small><br/>{item.text}</p></template></template><template lwc:else><p>Changes will appear here.</p></template></div></aside></div></template>
<template lwc:if={isAbout}><section class="about"><button class="back" data-tab="journey" onclick={navigate}>← Back to journey</button><h1>From first steps<br/><em>to a confident launch.</em></h1><p>This onboarding example helps an account manager follow required work across documents, discovery, configuration, training, review and launch.</p><div class="about-grid"><article><span>01</span><h2>Lightning Web Components</h2><p>The component renders the journey, task state and progress. It responds to task completion and lets an account manager add a follow-up.</p></article><article><span>02</span><h2>Apex and Salesforce</h2><p>The Salesforce component calls Apex to load Account and Task records. Apex checks required tasks before advancing the onboarding stage and creates follow-up Tasks.</p></article></div><p class="note">The public demo uses fictional in-memory data and does not execute Apex. Customer details, task editing, blockers and activity are browser-only features; the included Salesforce package does not yet implement them. Salesforce deployment and tests require an authenticated sandbox.</p><a class="download" href="/onboarding-source.zip" download>Download project source ↗</a></section></template></main><footer><span>ONBOARDING TRACKER</span><span>Interactive Salesforce LWC &amp; Apex showcase</span></footer></div></template>
